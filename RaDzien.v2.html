<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrum Dowodzenia Randką | 11.12.2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-anim {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden-content {
            display: none;
        }
        /* Styl paska przewijania dla mapy taktycznej */
        .tactical-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .tactical-scroll::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .tactical-scroll::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .tactical-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Container -->
    <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden card-anim z-10 relative" id="app-container">
        
        <!-- Header -->
        <div class="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center relative z-20">
            <div>
                <h1 class="text-lg font-bold text-blue-400"><i class="fas fa-heartbeat mr-2"></i>Randka Commander</h1>
                <p class="text-xs text-slate-500">Szczecin, 11.12.2025</p>
            </div>
            <button onclick="toggleTacticalMap()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs py-2 px-3 rounded shadow border border-slate-600 transition">
                <i class="fas fa-th-large mr-1"></i> WSZYSTKIE OPCJE
            </button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="p-6 min-h-[400px]">
            <!-- Content will be injected here by JS -->
        </div>

        <!-- Footer / Panic Button -->
        <div class="bg-slate-900 p-4 border-t border-slate-700 flex justify-between">
            <button onclick="resetApp()" class="text-slate-500 hover:text-white text-sm">
                <i class="fas fa-undo"></i> Reset
            </button>
            <button onclick="triggerPanic()" class="text-red-500 hover:text-red-400 text-sm font-bold animate-pulse">
                <i class="fas fa-exclamation-triangle"></i> AWARYJNE
            </button>
        </div>
    </div>

    <!-- Tactical Map Overlay (Grid View) -->
    <div id="tactical-map" class="fixed inset-0 bg-slate-900/95 z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h2 class="text-xl font-bold text-white"><i class="fas fa-map-marked-alt mr-2 text-blue-500"></i>Mapa Taktyczna</h2>
            <button onclick="toggleTacticalMap()" class="text-slate-400 hover:text-white text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="p-4 overflow-y-auto flex-grow tactical-scroll">
            <p class="text-slate-400 text-sm mb-4 text-center">Wybierz dowolny moduł, aby natychmiast do niego przeskoczyć.</p>
            <div class="grid grid-cols-2 gap-3" id="tactical-grid">
                <!-- Grid items injected by JS -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>

                stepNum: 1,

                    { label: "Zwiedzone, głodni!", next: 'food_decision', icon: "fa-utensils", color: "bg-emerald-600" }

            },
            blonia: {
                id: 'blonia',
                stepNum: 2,

                address: "Jasne Błonia im. Jana Pawła II",

                choices: [
                    { label: "Spacer zrobiony, głodni!", next: 'food_decision', icon: "fa-utensils", color: "bg-emerald-600" },

            food_decision: {

                tips: "Nie pytaj 'gdzie idziemy?', daj wybór: 'Wolisz coś rozgrzewającego z Azji czy włoski klasyk?'",
                choices: [
                    { label: "Azja (Elegancko)", next: 'jindu', icon: "fa-bowl-rice", color: "bg-red-700" },
                    { label: "Sushi (Modnie)", next: 'unagi', icon: "fa-fish", color: "bg-slate-700" },
                    { label: "Włoskie (Przytulnie)", next: 'pecorino', icon: "fa-pizza-slice", color: "bg-orange-600" },
                    { label: "Tylko deser na szybko", next: 'dutkiewicz', icon: "fa-ice-cream", color: "bg-pink-600" }
                ]
            },
            jindu: {
                id: 'jindu',

                    { label: "Najedzeni, co dalej?", next: 'culture_decision', icon: "fa-arrow-right", color: "bg-blue-600" }

            unagi: {
                id: 'unagi',
                stepNum: 4,
                title: "Unagi Sushi",

                choices: [
                    { label: "Najedzeni, co dalej?", next: 'culture_decision', icon: "fa-arrow-right", color: "bg-blue-600" }
                ]
            },
            pecorino: {
                id: 'pecorino',
                stepNum: 4,

                    { label: "Tylko Jarmark (Luz)", next: 'jarmark', icon: "fa-candy-cane", color: "bg-yellow-600" }

            },
            muzeum: {
                id: 'muzeum',
                stepNum: 5,
                title: "Muzeum Narodowe",

                address: "ul. Staromłyńska 1",
                tips: "Start 16:30. To opcja dla odważnych/ciekawych świata. Po wyjściu jesteście 50m od Jarmarku.",
                choices: [
                    { label: "Finał na Jarmarku", next: 'jarmark', icon: "fa-star", color: "bg-yellow-500" }

            },
            trafo: {
                id: 'trafo',
                stepNum: 5,
                title: "TRAFO Sztuka",

                color: "text-slate-300",
                desc: "Sztuka w starej transformatorowni.",
                address: "ul. Św. Ducha 4",
                tips: "Niesamowity budynek. Wystawy bywają kontrowersyjne - dobry temat do dyskusji.",
                choices: [
                    { label: "Finał na Jarmarku", next: 'jarmark', icon: "fa-star", color: "bg-yellow-500" }
                ]
            },
            jarmark: {
                id: 'jarmark',
                stepNum: 6,
                title: "FINAŁ: Jarmark",
                icon: "fa-gift",
                color: "text-yellow-500",
                desc: "Aleja Kwiatowa / Plac Żołnierza / Plac Adamowicza.",
                address: "Aleja Kwiatowa",
                tips: "1. Kup grzańca. 2. Przejdźcie się zobaczyć iluminacje. 3. Jeśli głodni - pierniki/pasztecik. To koniec zaplanowanej części - pełen spontan.",
                choices: [
                    { label: "Misja Zakończona Sukcesem", next: 'end', icon: "fa-flag-checkered", color: "bg-green-500" }
                ]
            },
            panic: {
                id: 'panic',
                stepNum: 99,
                title: "🚨 AWARYJNA: Kino",

                choices: [
                    { label: "Powrót do planu", next: 'start', icon: "fa-undo", color: "bg-slate-600" }
                ]
            },
            end: {
                id: 'end',
                stepNum: 7,
                title: "KONIEC",
                icon: "fa-glass-cheers",

                choices: []

        // --- RENDEROWANIE GŁÓWNEGO WIDOKU ---
        function renderStep(stepKey) {
            const step = steps[stepKey];
            const contentDiv = document.getElementById('content-area');
            
            // Budowanie HTML
            let choicesHtml = '';
            if (step.choices && step.choices.length > 0) {
                choicesHtml = `<div class="grid gap-3 mt-6">` + 
                    step.choices.map(choice => `
                        <button onclick="renderStep('${choice.next}')" 
                                class="w-full ${choice.color} hover:opacity-90 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex items-center justify-center transition transform active:scale-95 text-sm md:text-base">
                            <i class="fas ${choice.icon} mr-2"></i> ${choice.label}
                        </button>
                    `).join('') + 
                    `</div>`;
            }

            let mapButton = '';
            if (step.address) {
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(step.address)}`;
                mapButton = `<a href="${mapLink}" target="_blank" class="text-blue-400 text-sm hover:text-blue-300 mt-1 block">
                    <i class="fas fa-map-marker-alt"></i> ${step.address} (Mapa)
                </a>`;
            }

            const html = `
                <div class="card-anim">
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 rounded-full bg-slate-700 flex items-center justify-center text-2xl ${step.color} mr-4 shadow-inner flex-shrink-0">
                            <i class="fas ${step.icon}"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-white leading-tight">${step.title}</h2>
                            ${mapButton}
                        </div>
                    </div>
                    
                    <p class="text-slate-300 text-lg mb-4 leading-relaxed border-l-4 border-slate-600 pl-4 bg-slate-800/50 py-2">
                        ${step.desc}
                    </p>

                    ${step.tips ? `
                        <div class="mt-4">
                            <button onclick="toggleTips()" class="text-xs uppercase tracking-wide text-slate-500 font-bold hover:text-slate-300 focus:outline-none flex items-center">
                                <i class="fas fa-user-secret mr-1"></i> Ściąga / Bajer (Kliknij)
                            </button>
                            <div id="tips-box" class="hidden-content mt-2 p-3 bg-yellow-900/20 border border-yellow-700/50 rounded text-yellow-100 text-sm italic">
                                "${step.tips}"
                            </div>
                        </div>
                    ` : ''}

                    ${choicesHtml}
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        // --- MAPA TAKTYCZNA ---
        function renderTacticalGrid() {
            const gridDiv = document.getElementById('tactical-grid');
            let html = '';

            for (const key in steps) {
                const s = steps[key];
                html += `
                    <button onclick="jumpToStep('${key}')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 p-3 rounded-lg flex flex-col items-center justify-center text-center shadow transition h-28 relative overflow-hidden group">
                        <i class="fas ${s.icon} text-2xl mb-2 ${s.color} group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-bold text-slate-200 leading-tight">${s.title}</span>
                        ${s.id === 'panic' ? '<span class="absolute top-1 right-1 text-red-500 text-[10px] font-bold border border-red-500 px-1 rounded">SOS</span>' : ''}
                        ${s.id === 'miedzy_wierszami' || s.id === 'dutkiewicz' ? '<span class="absolute top-1 right-1 text-blue-400 text-[10px] font-bold border border-blue-400 px-1 rounded">NOWE</span>' : ''}
                    </button>
                `;
            }
            gridDiv.innerHTML = html;
        }

        function toggleTacticalMap() {
            const map = document.getElementById('tactical-map');
            map.classList.toggle('translate-y-full');
            // Renderuj grid tylko przy otwieraniu, żeby był świeży
            if (!map.classList.contains('translate-y-full')) {
                renderTacticalGrid();
            }
        }

        function jumpToStep(stepKey) {
            renderStep(stepKey);
            toggleTacticalMap(); // Zamknij mapę
        }

        // --- FUNKCJE POMOCNICZE ---
        function toggleTips() {
            const box = document.getElementById('tips-box');
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
            }
        }

        function triggerPanic() {
            renderStep('panic');
        }

        function resetApp() {
            renderStep('start');
        }

        // --- INICJALIZACJA ---
        renderStep('start');

    </script>
</body>
</html>
